<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zakiy AI — hamma savolga javob beradi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧠%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f6f7fb;--surface:#ffffff;--text:#1b1f2a;--muted:#6b7280;--line:#e3e6ee;
  --accent:#5b5bf0;--accent-text:#ffffff;--bot:#eef0ff;--user:#5b5bf0;--user-text:#fff;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1117;--surface:#171a23;--text:#e8eaf0;--muted:#9aa1b2;--line:#262b38;
    --accent:#7c7cff;--accent-text:#0f1117;--bot:#1f2333;--user:#7c7cff;--user-text:#0f1117;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1117;--surface:#171a23;--text:#e8eaf0;--muted:#9aa1b2;--line:#262b38;
  --accent:#7c7cff;--accent-text:#0f1117;--bot:#1f2333;--user:#7c7cff;--user-text:#0f1117;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;line-height:1.55}
header{display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--line)}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#b06bff);display:grid;place-items:center;color:#fff;font-weight:700;font-size:20px}
header h1{font-size:18px;margin:0}
header p{margin:0;font-size:13px;color:var(--muted)}
#chat{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;max-width:820px;width:100%;margin:0 auto}
.msg{max-width:85%;padding:10px 14px;border-radius:16px;word-wrap:break-word;overflow-wrap:anywhere}
.msg.bot{background:var(--bot);align-self:flex-start;border-bottom-left-radius:4px}
.msg.user{background:var(--user);color:var(--user-text);align-self:flex-end;border-bottom-right-radius:4px;white-space:pre-wrap}
.msg pre{background:var(--surface);border:1px solid var(--line);padding:10px;border-radius:8px;overflow-x:auto;font-size:13px}
.msg code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.92em}
.msg p{margin:0 0 8px}.msg p:last-child{margin:0}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--text);padding:8px 12px;border-radius:999px;font-size:14px;cursor:pointer}
.chip:hover{border-color:var(--accent)}
footer{background:var(--surface);border-top:1px solid var(--line);padding:12px 18px}
.row{display:flex;gap:10px;max-width:820px;margin:0 auto}
textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:14px;padding:11px 14px;font:inherit;max-height:140px;outline:none}
textarea:focus{border-color:var(--accent)}
button.send{border:0;background:var(--accent);color:var(--accent-text);border-radius:14px;padding:0 20px;font:inherit;font-weight:600;cursor:pointer}
button.send:disabled{opacity:.5;cursor:default}
.note{max-width:820px;margin:6px auto 0;font-size:12px;color:var(--muted);text-align:center}
.tools{display:flex;gap:8px;max-width:820px;margin:0 auto 8px;align-items:center;flex-wrap:wrap}
.tbtn{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:7px 12px;font:inherit;font-size:14px;cursor:pointer}
.tbtn.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
#preview{display:none;align-items:center;gap:8px}
#preview img{height:44px;border-radius:8px;border:1px solid var(--line)}
.msg img.pic{max-width:100%;border-radius:10px;display:block;margin:6px 0;background:#fff}
</style>
</head>
<body>
<header>
  <div class="logo">Z</div>
  <div>
    <h1>Zakiy AI</h1>
    <p>Sun’iy intellekt yordamchingiz — istalgan savolni bering</p>
  </div>
</header>

<div id="chat" aria-live="polite"></div>

<footer>
  <div class="tools">
    <button class="tbtn" id="attachBtn" type="button">📎 Rasm yuborish</button>
    <button class="tbtn" id="drawBtn" type="button">🎨 Rasm chizish: oʻchiq</button>
    <button class="tbtn" id="songBtn" type="button">🎵 Qoʻshiq yozish: oʻchiq</button>
    <span id="preview"><img id="prevImg" alt=""><button class="tbtn" id="rmBtn" type="button">✕</button></span>
    <input type="file" id="file" accept="image/*" hidden>
  </div>
  <div class="row">
    <textarea id="input" rows="1" placeholder="Savolingizni yozing…"></textarea>
    <button class="send" id="send">Yuborish</button>
  </div>
  <div class="note" id="note">Zakiy AI xato qilishi mumkin. Muhim ma’lumotlarni tekshirib oling.</div>
</footer>

<script>
(function(){
  var chat=document.getElementById('chat'),input=document.getElementById('input'),sendBtn=document.getElementById('send'),note=document.getElementById('note');
  var history=[],busy=false,drawMode=false,songMode=false,attached=null;

  function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  function fmt(t){
    var parts=t.split('```'),out='';
    for(var i=0;i<parts.length;i++){
      if(i%2===1){var c=parts[i].replace(/^[a-zA-Z0-9+#-]*\n/,'');out+='<pre><code>'+esc(c)+'</code></pre>';}
      else{
        var h=esc(parts[i]).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/`([^`]+)`/g,'<code>$1</code>');
        h.split(/\n{2,}/).forEach(function(p){if(p.trim())out+='<p>'+p.replace(/\n/g,'<br>')+'</p>';});
      }
    }
    return out||'';
  }
  function add(role,text){
    var d=document.createElement('div');d.className='msg '+role;
    if(role==='user')d.textContent=text;else d.innerHTML=fmt(text);
    chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d;
  }
  function show(bubble,text){
    var m=text.match(/```svg\s*([\s\S]*?)(```|$)/i);
    if(m){
      var rest=text.replace(/```svg[\s\S]*?(```|$)/i,'').trim();
      var s=m[1].replace(/<script[\s\S]*?<\/script>/gi,'').replace(/\son\w+\s*=\s*("[^"]*"|'[^']*')/gi,'');
      if(!/xmlns=/.test(s))s=s.replace(/<svg/i,'<svg xmlns="http://www.w3.org/2000/svg"');
      bubble.innerHTML=rest?fmt(rest):'';
      var im=document.createElement('img');im.className='pic';im.alt='Chizilgan rasm';
      im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
      bubble.insertBefore(im,bubble.firstChild);
    }else{bubble.innerHTML=fmt(text);}
    chat.scrollTop=chat.scrollHeight;
  }
  function toB64(f){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(String(r.result).split(',')[1])};r.onerror=rej;r.readAsDataURL(f)})}

  add('bot','Salom! Men **Zakiy AI**man. Menga istalgan mavzuda savol bering: ta’lim, dasturlash, tarjima, matn yozish, maslahat — hammasiga yordam beraman. Rasm yuborishingiz, rasm chizdirishingiz va qoʻshiq yozdirishingiz ham mumkin.');
  var chips=document.createElement('div');chips.className='chips';
  ['Fotosintez nima?','Menga qisqa she’r yoz','JavaScriptda massivni qanday saralash mumkin?','Ingliz tilini tez oʻrganish yoʻllari'].forEach(function(q){
    var b=document.createElement('button');b.className='chip';b.textContent=q;b.onclick=function(){ask(q)};chips.appendChild(b);
  });
  chat.appendChild(chips);

  var preview=document.getElementById('preview'),prevImg=document.getElementById('prevImg'),fileIn=document.getElementById('file');
  var drawBtn=document.getElementById('drawBtn'),songBtn=document.getElementById('songBtn');
  function setModes(){
    drawBtn.classList.toggle('on',drawMode);songBtn.classList.toggle('on',songMode);
    drawBtn.textContent='🎨 Rasm chizish: '+(drawMode?'yoqiq':'oʻchiq');
    songBtn.textContent='🎵 Qoʻshiq yozish: '+(songMode?'yoqiq':'oʻchiq');
  }
  drawBtn.onclick=function(){drawMode=!drawMode;if(drawMode)songMode=false;setModes();};
  songBtn.onclick=function(){songMode=!songMode;if(songMode)drawMode=false;setModes();};
  document.getElementById('attachBtn').onclick=function(){fileIn.click()};
  fileIn.onchange=function(){
    var f=fileIn.files[0];fileIn.value='';if(!f)return;
    if(f.size>2.5*1024*1024){note.textContent='Rasm 2,5 MB dan kichik boʻlsin.';return;}
    attached=f;prevImg.src=URL.createObjectURL(f);preview.style.display='inline-flex';
  };
  document.getElementById('rmBtn').onclick=function(){attached=null;preview.style.display='none'};

  async function ask(text){
    text=(text||'').trim();
    if((!text&&!attached)||busy)return;
    if(!text)text='Bu rasmda nima bor? Batafsil tushuntir.';
    busy=true;sendBtn.disabled=true;chips.remove();
    var pic=attached;attached=null;preview.style.display='none';
    var ub=add('user',text);
    if(pic){var pi=document.createElement('img');pi.className='pic';pi.src=URL.createObjectURL(pic);ub.appendChild(pi);}
    input.value='';input.style.height='auto';
    var bubble=add('bot','…');
    try{
      var content=text;
      if(pic){content=[{type:'image',source:{type:'base64',media_type:pic.type||'image/jpeg',data:await toB64(pic)}},{type:'text',text:text}];}
      var recent=history.slice(-12);
      while(recent.length&&recent[0].role!=='user')recent.shift();
      var msgs=recent.concat([{role:'user',content:content}]);
      var resp=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:msgs,mode:drawMode?'draw':(songMode?'song':'chat')})});
      var data=await resp.json().catch(function(){return {}});
      if(!resp.ok)throw new Error(data.error||'xato');
      show(bubble,data.text);
      history.push({role:'user',content:text+(pic?' [rasm ilova qilindi]':'')});
      history.push({role:'assistant',content:data.text.replace(/```svg[\s\S]*?```/gi,'[SVG rasm chizildi]')});
    }catch(e){
      bubble.innerHTML=fmt(String(e.message||'').indexOf('Koʻp')===0?e.message:'Xatolik yuz berdi. Birozdan soʻng qayta urinib koʻring.');
    }
    busy=false;sendBtn.disabled=false;input.focus();
  }
  sendBtn.onclick=function(){ask(input.value)};
  input.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask(input.value);}});
  input.addEventListener('input',function(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,140)+'px';});
})();
</script>
</body>
</html>
